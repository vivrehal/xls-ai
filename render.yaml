services:
  # Backend API Service
  - type: web
    name: xls-ai-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: xls-ai-mongodb
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # You'll set this manually in Render dashboard
      - key: ENABLE_GEMINI
        value: "true"
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash-latest"

databases:
  - name: xls-ai-mongodb
    databaseName: xlsai
    user: xlsai_user
